name: Convert Conf Files and Push to Repo

on:
  schedule:
    - cron: "0 1 * * *" # every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert_conf_files:
    # 固定 ubuntu-24.04，避免 ubuntu-latest 迁移到 Ubuntu 26 后 setup-python 找不到对应构建
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Convert Conf Files
      env:
        CN_DNS: ${{ vars.CN_DNS }}
        THE_DNS: ${{ vars.THE_DNS }}
      run: python convert.py

    - name: Check for changes
      run: |
        if ! git diff --quiet; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          current_time=$(date +'%Y-%m-%d %H:%M:%S')
          git add .
          git commit -m "Convert conf files to txt - $current_time"
        else
          echo "No changes to commit."
        fi

    - name: Push changes
      uses: ad-m/github-push-action@v0.8.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: master
